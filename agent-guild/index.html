<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Guild｜エージェントギルド</title>
<meta name="description" content="言葉で育てたAIの冒険者が、シーズンごとのボスに挑むドット絵ゲームの紹介">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #12152a;
  --panel: #1d2242;
  --panel-2: #262c55;
  --line: #3a4280;
  --ink: #ece9f6;
  --muted: #9aa0c8;
  --accent: #feae34;
  --accent-2: #63c74d;
  --danger: #e43b44;
  --info: #5fcde4;
  --purple: #c77dff;
  --font: "DotGothic16", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; overflow-x: clip; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; }
a { color: var(--accent); }
h2 { font-size: 22px; margin: 4px 0 12px; letter-spacing: .04em; }
h3 { font-size: 16px; margin: 20px 0 8px; color: var(--accent); }
code, pre, .editor { font-family: var(--mono); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.ok { color: var(--accent-2); }
.ng { color: #ff8a8a; }
.pixel { image-rendering: pixelated; image-rendering: crisp-edges; }
.hidden { display: none !important; }

/* 枠はドット風の段付き影 */
.px-box, .stage, .side, .sample, .award, .fighter-card, .results-inner, .empty, .notice {
  background: var(--panel);
  box-shadow: 0 0 0 2px var(--line), 4px 4px 0 0 #0a0c18;
}

.topbar {
  display: flex; align-items: center; gap: 20px; padding: 10px 20px;
  background: #0d1022; border-bottom: 3px solid var(--line); position: sticky; top: 0; z-index: 10;
}
.logo { color: var(--ink); text-decoration: none; font-size: 18px; letter-spacing: .06em; white-space: nowrap; }
.logo-mark { color: var(--accent); }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { color: var(--muted); text-decoration: none; padding: 4px 10px; }
nav a:hover { color: var(--ink); }
nav a.on { color: #12152a; background: var(--accent); }
.demo-flag { margin-left: auto; font-size: 12px; color: #12152a; background: var(--info); padding: 2px 8px; display: none; }
body.demo .demo-flag { display: inline-block; }

main { max-width: 1280px; margin: 0 auto; padding: 20px; }
.loading { color: var(--muted); }
.empty { padding: 32px; text-align: center; }

.btn {
  font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--panel-2);
  border: 0; box-shadow: 0 0 0 2px var(--line), 2px 2px 0 0 #0a0c18; padding: 6px 14px; cursor: pointer; text-decoration: none; display: inline-block;
}
.btn:hover { background: var(--line); }
.btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 2px var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #12152a; width: 100%; font-size: 16px; padding: 10px; margin-top: 12px; }
.btn-primary:hover { background: #ffc35e; }
.btn-small { font-size: 12px; padding: 2px 8px; }
.btn-icon { width: 36px; padding: 6px 0; text-align: center; }
.btn-speed.on { background: var(--accent); color: #12152a; }
.link { display: inline-block; margin-top: 8px; }

/* アリーナ */
.arena-page { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.stage { padding: 10px; }
.hud-top { display: flex; align-items: center; gap: 12px; padding: 4px 6px 10px; flex-wrap: wrap; }
.hud-wave { color: var(--accent); font-size: 18px; letter-spacing: .08em; }
.hud-case { font-size: 16px; }
.hud-alive { margin-left: auto; color: var(--accent-2); }
.badge { font-size: 12px; padding: 1px 8px; background: var(--panel-2); }
.badge-trap { background: #5a3d8a; }
.badge-bonus { background: #a0612a; }
.badge-boss { background: var(--danger); }
.canvas-wrap { position: relative; line-height: 0; }
.arena-canvas { width: 100%; height: auto; display: block; background: #4b8b3b; }
.controls { display: flex; align-items: center; gap: 8px; padding-top: 10px; }
.controls input[type=range] { flex: 1; accent-color: var(--accent); min-width: 60px; }
.banner {
  position: absolute; left: 50%; top: 10px; transform: translate(-50%, -10px); opacity: 0; pointer-events: none;
  background: rgba(13,16,34,.9); padding: 6px 18px; font-size: 16px; line-height: 1.4; transition: opacity .25s, transform .25s; white-space: nowrap;
  box-shadow: 0 0 0 3px var(--accent);
}
.banner.show { opacity: 1; transform: translate(-50%, 0); }
.banner-boss { box-shadow: 0 0 0 3px var(--danger); color: #ffb3b3; }
.banner-storm { box-shadow: 0 0 0 3px var(--purple); color: #e2c2ff; font-size: 16px; }
.banner-trap { box-shadow: 0 0 0 3px #9d7be0; }
.killfeed { position: absolute; right: 8px; top: 44px; margin: 0; padding: 0; list-style: none; line-height: 1.5; font-size: 12px; text-align: right; pointer-events: none; }
.killfeed li { background: rgba(13,16,34,.8); padding: 2px 8px; margin-bottom: 3px; display: block; }
.results { position: absolute; inset: 0; background: rgba(13,16,34,.86); display: flex; align-items: flex-start; justify-content: center; line-height: 1.5; overflow: auto; padding: 12px; }
.results-inner { padding: 16px 20px; max-width: 640px; width: 100%; }
.results-inner h2 { text-align: center; color: var(--accent); }
.podium { display: flex; justify-content: center; align-items: flex-end; gap: 16px; margin-bottom: 12px; }
.podium-slot { display: flex; flex-direction: column; align-items: center; }
.podium-slot canvas { width: 84px; height: 65px; }
.podium-name { font-size: 13px; }
.podium-block { width: 80px; text-align: center; background: var(--panel-2); color: var(--accent); font-size: 20px; }
.p1 .podium-block { height: 56px; background: var(--accent); color: #12152a; }
.p2 .podium-block { height: 40px; }
.p3 .podium-block { height: 28px; }

.side { padding: 14px; }
.side h3:first-child { margin-top: 0; }
.roster-list { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: 520px; overflow: auto; }
.roster-item { display: grid; grid-template-columns: 48px 1fr 64px 46px; align-items: center; gap: 6px; padding: 2px 6px; cursor: pointer; font-size: 13px; }
.roster-item canvas { width: 28px; height: 30px; }
.roster-item:hover, .roster-item.selected { background: var(--panel-2); }
.roster-item.dead { opacity: .4; }
.roster-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roster-stat { font-size: 11px; color: var(--muted); text-align: right; }
.hpbar { height: 6px; background: #0a0c18; display: block; }
.hpfill { display: block; height: 100%; background: var(--accent-2); transition: width .15s; }
.hpbar.mid .hpfill { background: var(--accent); }
.hpbar.low .hpfill { background: var(--danger); }
.fighter-card { padding: 12px; background: var(--panel-2); box-shadow: none; }
.card-head { display: flex; gap: 10px; align-items: center; }
.card-head canvas { width: 84px; height: 65px; }
.kodawari { margin: 10px 0; padding: 6px 10px; border-left: 3px solid var(--accent); color: var(--ink); background: rgba(254,174,52,.08); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
.chip { font-size: 11px; padding: 1px 6px; background: #0d1022; box-shadow: 0 0 0 1px var(--line); }
.chip-sub { color: #ffd166; }
.chip-skill { color: #ff9ce6; }
.chip-tool { color: var(--info); }
.chip-team { color: #fff; background: var(--panel-2); }
.radar { display: block; margin: 6px auto; }
.radar-grid { fill: none; stroke: var(--line); stroke-width: 1; }
.radar-area { fill: rgba(254,174,52,.3); stroke: var(--accent); stroke-width: 2; }
.radar-label { fill: var(--muted); font-size: 10px; font-family: var(--font); }
.mini-stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0; font-size: 13px; }
.mini-stats dt { color: var(--muted); }
.mini-stats dd { margin: 0; text-align: right; }

/* 表 */
.table-wrap { overflow-x: auto; }
.table { border-collapse: collapse; width: 100%; font-size: 13px; }
.table th { text-align: left; color: var(--muted); font-weight: normal; border-bottom: 2px solid var(--line); padding: 6px 8px; white-space: nowrap; }
.table td { padding: 6px 8px; border-bottom: 1px solid #2a3060; vertical-align: middle; }
.table.compact td, .table.compact th { padding: 3px 6px; }
.table tbody tr:hover { background: var(--panel-2); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.rank { font-size: 18px; text-align: center; }
.who { display: flex; align-items: center; gap: 8px; }
.who canvas { width: 28px; height: 30px; }
.awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0 20px; }
.award { padding: 10px 12px; }
.award-title { color: var(--accent); font-size: 12px; }
.award-name { font-size: 16px; }

/* 提出 */
.submit-page { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.editor {
  width: 100%; min-height: 460px; resize: vertical; background: #0b0e1e; color: #e8e6f0; border: 0;
  box-shadow: 0 0 0 2px var(--line); padding: 12px; font-size: 13px; line-height: 1.55; tab-size: 2;
}
.editor:focus { outline: 2px solid var(--accent); }
.errors { list-style: none; padding: 0; margin: 8px 0; color: #ff9c9c; font-size: 13px; }
.errors li::before { content: "✕ "; }
.catalog { margin-top: 12px; }
.catalog summary { cursor: pointer; color: var(--accent); }
.catalog ul { list-style: none; padding: 0; }
.catalog li { padding: 4px 0; border-bottom: 1px solid #2a3060; }
.catalog li .btn { margin-right: 6px; }
.preview-box { background: radial-gradient(circle at 50% 70%, #b08a5a 0 40%, #4b8b3b 41%); display: flex; flex-direction: column; align-items: center; padding: 10px 0 6px; box-shadow: 0 0 0 2px var(--line); }
.preview { width: 260px; height: 200px; max-width: 100%; }
.preview-action { background: rgba(13,16,34,.7); padding: 0 8px; margin-top: 2px; }
.preview-name { font-size: 16px; background: rgba(13,16,34,.8); padding: 0 10px; }
.body-picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0; }
.body-btn { background: var(--panel-2); border: 0; color: var(--ink); font-family: var(--font); font-size: 12px; cursor: pointer; padding: 2px; box-shadow: 0 0 0 2px var(--line); display: flex; flex-direction: column; align-items: center; }
.body-btn canvas { width: 58px; height: 45px; }
.body-btn.on { box-shadow: 0 0 0 2px var(--accent); background: #3a3150; }
.color-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13px; }
.color-row input[type=color] { width: 34px; height: 26px; border: 0; padding: 0; background: none; vertical-align: middle; }
.color-row select, .login input { font-family: var(--font); background: #0b0e1e; color: var(--ink); border: 0; box-shadow: 0 0 0 2px var(--line); padding: 4px 6px; }
.meter { position: relative; height: 22px; background: #0b0e1e; box-shadow: 0 0 0 2px var(--line); }
.meter-fill { position: absolute; left: 0; top: 0; bottom: 0; background: repeating-linear-gradient(90deg, var(--accent-2) 0 8px, #4fae3c 8px 10px); transition: width .2s; }
.meter-fill.over { background: repeating-linear-gradient(90deg, var(--danger) 0 8px, #b02a33 8px 10px); }
.meter-text { position: absolute; inset: 0; text-align: center; line-height: 22px; font-size: 13px; text-shadow: 1px 1px 0 #000; }
.breakdown { list-style: none; padding: 0; margin: 8px 0; font-size: 13px; }
.breakdown li { display: grid; grid-template-columns: 1fr auto 32px; gap: 8px; padding: 2px 0; border-bottom: 1px dashed #2a3060; }
.breakdown b { text-align: right; font-weight: normal; color: var(--accent); }
.bd-subagent span:first-child { color: #ffd166; }
.bd-skill span:first-child { color: #ff9ce6; }
.bd-tool span:first-child { color: var(--info); }
.account { margin-top: 16px; font-size: 13px; }
.login { display: flex; flex-direction: column; gap: 6px; }
.notice { padding: 8px 12px; font-size: 13px; }
.subs { margin-top: 16px; }

/* 課題 */
.eyebrow { color: var(--info); margin: 0; font-size: 13px; }
.lead { font-size: 17px; }
.code { background: #0b0e1e; padding: 10px 12px; overflow-x: auto; box-shadow: 0 0 0 2px var(--line); font-size: 13px; white-space: pre-wrap; word-break: break-all; line-height: 1.5; }
.sample { padding: 10px 14px; margin-bottom: 10px; }
.sample p { margin: 4px 0; }
.build-head { display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; }
.build-head canvas { width: 182px; height: 140px; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 20px); opacity: 0; transition: .25s; background: var(--panel-2); padding: 10px 16px; box-shadow: 0 0 0 2px var(--accent); z-index: 20; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast-err { box-shadow: 0 0 0 2px var(--danger); }

@media (max-width: 900px) {
  main { padding: 16px; }
  .arena-page, .submit-page { grid-template-columns: minmax(0, 1fr); }
  .controls { flex-wrap: wrap; }
  .controls input[type=range] { flex-basis: 100%; order: -1; }
  .hud-top { gap: 8px; }
  .hud-case { font-size: 14px; }
  .roster-item { grid-template-columns: 48px 1fr 70px 46px; }
  .editor { min-height: 360px; }
  .topbar { flex-wrap: wrap; gap: 8px; padding: 8px 16px; }
  .build-head { grid-template-columns: 1fr; justify-items: start; }
  .banner { font-size: 15px; white-space: normal; width: 80%; text-align: center; }
  .killfeed { display: none; }
}

/* モード切替 */
.mode-bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
.tabs { display: flex; gap: 4px; }
.tab { font-family: var(--font); font-size: 15px; color: var(--muted); background: var(--panel); border: 0; padding: 6px 16px; cursor: pointer; box-shadow: 0 0 0 2px var(--line); }
.tab:hover { color: var(--ink); }
.tab.on { color: #12152a; background: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.tab:focus-visible, .btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.duel-pick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.duel-pick select { font-family: var(--font); background: #0b0e1e; color: var(--ink); border: 0; box-shadow: 0 0 0 2px var(--line); padding: 4px 8px; max-width: 46vw; }
.vs { color: var(--danger); font-size: 18px; letter-spacing: .1em; }
.mode-desc { margin: 4px 0 12px; }
.duel-result { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 12px; }
.duel-side { display: flex; flex-direction: column; align-items: center; opacity: .6; }
.duel-side.win { opacity: 1; }
.duel-side canvas { width: 130px; height: 100px; }
.win-label { color: #12152a; background: var(--accent); padding: 0 12px; font-size: 18px; }
.lose-label { color: var(--muted); }
.team-result { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.team-row { display: flex; gap: 12px; align-items: baseline; padding: 6px 10px; background: var(--panel-2); border-left: 4px solid var(--line); }
.team-rank { color: var(--accent); min-width: 40px; }
.team-name { font-size: 16px; }
.team-dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; }
.legend { list-style: none; padding: 8px 10px; margin: 8px 0 0; font-size: 12px; background: var(--panel-2); display: grid; gap: 2px; }
.legend b { color: var(--accent); font-weight: normal; display: inline-block; min-width: 4.5em; }
.roster-item.mine { background: rgba(255,209,102,.12); box-shadow: inset 3px 0 0 #ffd166; }
.roster-item.mine .roster-name::before { content: "あなた "; color: #ffd166; font-size: 11px; }
.card-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; }
.card-actions .btn.on { background: #ffd166; color: #12152a; }

/* 性格・見た目の選択 */
.pers-row { display: flex; flex-wrap: wrap; gap: 6px; }
.pers-btn.on { box-shadow: 0 0 0 2px var(--accent); background: #3a3150; }
.pers-note { margin: 6px 0 10px; min-height: 2.6em; }
.p-rush { --pc: #ff5a5a; } .p-guard { --pc: #5fa8ff; } .p-pack { --pc: #63d471; } .p-auto { --pc: #c9ced8; }
.pers-btn { border-left: 4px solid var(--pc) !important; }
.persona-tag { display: inline-block; font-size: 10px; line-height: 1; padding: 2px 4px; margin-left: 6px; color: #0b0e1e; background: var(--pc); vertical-align: middle; }
.chip-persona { box-shadow: inset 3px 0 0 var(--pc); }
.looks { display: grid; gap: 6px; margin: 4px 0 12px; }
.look-row { display: grid; grid-template-columns: 44px 1fr auto auto; align-items: center; gap: 8px; background: var(--panel-2); padding: 4px 8px; font-size: 12px; }
.look-row select { font-family: var(--font); background: #0b0e1e; color: var(--ink); border: 0; box-shadow: 0 0 0 2px var(--line); padding: 2px 4px; }
.look-row input[type=color] { width: 30px; height: 24px; border: 0; padding: 0; background: none; }
.look-sprite { justify-self: center; max-width: 44px; max-height: 36px; }
.look-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.swatch { display: inline-block; width: 8px; height: 8px; margin-right: 4px; box-shadow: 0 0 0 1px rgba(0,0,0,.5); vertical-align: middle; }

/* ビルダー（提出画面） */
.builder { display: grid; gap: 16px; }
.builder .card { background: var(--panel); box-shadow: 0 0 0 2px var(--line), 4px 4px 0 0 #0a0c18; padding: 12px 16px 16px; }
.builder .card h3 { margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; min-width: 0; flex: 1; }
.field-label { font-size: 12px; color: var(--muted); }
.field-note { font-size: 11px; color: var(--muted); }
.field input:not([type]), .field input[type=text], .prompt-box, .builder select {
  font-family: var(--font); font-size: 14px; background: #0b0e1e; color: var(--ink); border: 0; box-shadow: 0 0 0 2px var(--line); padding: 6px 8px; width: 100%;
}
.prompt-box { font-family: var(--font); line-height: 1.6; resize: vertical; min-height: 90px; }
.field input:focus, .prompt-box:focus, .builder select:focus { outline: 2px solid var(--accent); }
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.tool-card { background: var(--panel-2); padding: 8px 10px; box-shadow: 0 0 0 2px transparent; }
.tool-card.on { box-shadow: 0 0 0 2px var(--info); }
.tool-card p { margin: 4px 0; }
.tool-head { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.tool-head b { font-weight: normal; color: var(--info); flex: 1; }
.tool-cost { font-size: 12px; color: var(--accent); }
.sub-card { background: var(--panel-2); padding: 8px 12px; margin: 10px 0; }
.sub-card .row-between { align-items: flex-end; }
.chk-row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin: 6px 0; }
.chk-row .field-label { width: 100%; }
.chk { font-size: 13px; display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.builder .look-row { grid-template-columns: 44px 1fr auto; padding: 4px 0; background: none; }
.look-img { display: flex; justify-content: center; }
.adv summary { cursor: pointer; color: var(--accent); }
.adv .editor { min-height: 260px; margin: 8px 0; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
/* ウェーブごとの正誤の帯 */
.wave-strip { grid-column: 1 / -1; display: flex; gap: 1px; padding: 0 0 2px 54px; }
.wave-strip .wv { flex: 1; max-width: 10px; height: 5px; background: #2a3060; }
.wave-strip .wv.ok { background: #63c74d; }
.wave-strip .wv.ng { background: #e43b44; }
.wave-strip .wv.pass { background: #9aa0c8; }
.wave-strip .wv.mp { background: #5f8cff; }
.answer-sheet { margin-top: 12px; }
.answer-sheet summary { cursor: pointer; color: var(--accent); }
.sheet td.mk { text-align: center; padding: 1px 2px; font-size: 12px; }
.sheet th { padding: 1px 2px; text-align: center; font-size: 11px; }
.mk.ok { color: #7bed9f; } .mk.ng { color: #ff6b6b; } .mk.pass { color: var(--muted); }
.sheet td.name { white-space: nowrap; }

/* --- ホーム・紹介ページ --- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 24px; align-items: center; margin: 8px 0 28px; }
.hero h1 { font-size: 34px; margin: 4px 0 8px; letter-spacing: .06em; color: var(--accent); }
.hero .lead { font-size: 17px; }

.mini-empty { line-height: 1.6; padding: 40px 16px; text-align: center; color: var(--muted); }
.eyebrow { color: var(--info); font-size: 13px; letter-spacing: .1em; margin: 0; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 28px; }
.step { background: var(--panel); box-shadow: 0 0 0 2px var(--line), 4px 4px 0 0 #0a0c18; padding: 14px 16px; }
.step h3 { margin-top: 4px; }
.step-no { display: inline-block; width: 28px; height: 28px; line-height: 28px; text-align: center; background: var(--accent); color: #12152a; }
.about-block { max-width: 820px; margin: 0 0 26px; }
.about-block h2 { color: var(--accent); }
.faq dt { margin-top: 12px; color: var(--ink); }
.faq dd { margin: 2px 0 0; color: var(--muted); }
.rule-list { padding-left: 20px; }
.rule-list li { margin: 4px 0; }
.cta-bottom { padding: 18px; background: var(--panel); box-shadow: 0 0 0 2px var(--line); }
.row-gap { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.login-card, .entry-card { background: var(--panel); box-shadow: 0 0 0 2px var(--line), 4px 4px 0 0 #0a0c18; padding: 12px 16px; margin-top: 12px; }
.login-card h3, .entry-card h3 { margin-top: 4px; }
.entry-card .btn-primary { width: 100%; }
.account-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 12px 0 16px; }
.stat { background: var(--panel); box-shadow: 0 0 0 2px var(--line), 3px 3px 0 0 #0a0c18; padding: 10px 14px; }
.stat-label { color: var(--muted); font-size: 12px; }
.stat-value { font-size: 24px; color: var(--accent); line-height: 1.3; }
.next-card { background: var(--panel); box-shadow: 0 0 0 2px var(--accent); padding: 12px 16px; margin: 8px 0 12px; }
.next-card p { margin: 0 0 10px; }
.view-tabs { align-items: center; }
.view-label { margin-right: 4px; }
.tab:disabled { opacity: .4; cursor: not-allowed; }
.stage-note { margin: 0 0 8px; }
@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; }
  .steps { grid-template-columns: 1fr; }
  .stat-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero h1 { font-size: 28px; }
}

/* --- つくる画面: 課題パネル・試走・確認 --- */
.submit-page { grid-template-columns: 300px minmax(0, 1fr) 340px; }
.task-col { background: var(--panel); box-shadow: 0 0 0 2px var(--line), 4px 4px 0 0 #0a0c18; padding: 12px 14px; position: sticky; top: 56px; max-height: calc(100vh - 72px); overflow-y: auto; }
.task-col h3:first-child { margin-top: 0; }
.task-col details { margin: 8px 0; }
.task-col summary { cursor: pointer; color: var(--accent); }
.task-col .code { white-space: pre-wrap; margin: 6px 0; }
.ref-body { max-height: 180px; overflow-y: auto; }
.tool-mini { padding-left: 16px; }
.panel-tabs { display: none; margin-bottom: 10px; }
.run-cost { margin: 4px 0 8px; }
.btn-trial { width: 100%; margin-bottom: 8px; }
.trial-result { margin-bottom: 8px; }
.trial-list { list-style: none; padding: 0; margin: 6px 0; }
.trial-list li { padding: 6px 8px; margin: 4px 0; background: var(--panel-2); }
.trial-ok { box-shadow: inset 3px 0 0 var(--accent-2); }
.trial-ng { box-shadow: inset 3px 0 0 var(--danger); }
.confirm-box:not(:empty) { background: var(--panel-2); box-shadow: 0 0 0 2px var(--accent); padding: 10px 12px; margin-top: 10px; }
.confirm-box p { margin: 0 0 8px; }
.mine-row { background: rgba(254, 174, 52, .14); }
.history-bar { display: inline-block; height: 8px; background: var(--accent-2); vertical-align: middle; }
@media (max-width: 1200px) {
  /* 課題は隠さず、ビルダーの上に並べる（課題を見ながら組めるように） */
  .submit-page { grid-template-columns: minmax(0, 1fr) 340px; }
  .task-col { grid-column: 1 / -1; position: static; max-height: 260px; }
}
@media (max-width: 760px) {
  .task-col { display: none; max-height: none; }
  .panel-tabs { display: flex; }
  .submit-page.show-task .task-col { display: block; grid-column: 1 / -1; }
  .submit-page.show-task .editor-col, .submit-page.show-task .side { display: none; }
}
.guide { border-left: 4px solid var(--accent); }
.guide h3 { margin-top: 0; }
.guide-ex { background: var(--panel-2); padding: 8px 12px; margin: 8px 0; }
.guide-q { margin: 2px 0 8px; font-size: 15px; }
.guide-steps { padding-left: 20px; margin: 8px 0; }
.guide-steps li { margin: 4px 0; }
@media (max-width: 900px) { .submit-page { grid-template-columns: minmax(0, 1fr); } }

.dash .mini-battle { max-width: 760px; }
.next-card .btn-primary { width: auto; margin-top: 0; padding: 8px 18px; }
.task-col .row-gap { margin: 6px 0 10px; }
.hero .btn-primary, .cta-bottom .btn-primary { width: auto; margin-top: 0; padding: 10px 22px; }

/* --- 診断 --- */
.diag { border-left: 4px solid var(--accent); }
.diag h3 { margin-top: 0; }
.diag-top { font-size: 16px; margin: 6px 0 10px; }
.diag-list { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 10px; }
.diag-head { display: flex; justify-content: space-between; gap: 12px; }
.diag-bar { height: 8px; background: var(--panel-2); margin: 4px 0; }
.diag-fill { height: 100%; background: var(--accent-2); }
.diag-warn .diag-fill { background: var(--accent); }
.diag-bad .diag-fill { background: var(--danger); }
.diag-list p { margin: 2px 0 0; }

/* --- 何を競うのか --- */
.compete { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 10px 0; }
.compete-card { background: var(--panel); box-shadow: 0 0 0 2px var(--line), 3px 3px 0 0 #0a0c18; padding: 10px 12px; }
.compete-card p { margin: 6px 0 0; }
.compete-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.compete-head b { color: var(--accent); font-size: 16px; }
.compete-stat { font-size: 11px; color: var(--muted); }
.composition { display: grid; gap: 4px; margin: 8px 0; }
.comp-row { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(60px, 1fr) 44px; gap: 8px; align-items: center; font-size: 13px; }
.comp-bar { height: 8px; background: var(--panel-2); }
.comp-fill { display: block; height: 100%; background: var(--accent-2); }
.comp-n { text-align: right; }
.guide-axes { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; padding: 0; list-style: none; }
.guide-axes li { background: var(--panel-2); padding: 2px 10px; font-size: 13px; }

.field-note.over { color: var(--danger); font-weight: bold; }
.tool-card.full { opacity: .45; }
.guard-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; }
.guard-row input { font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--panel-2); border: 0; padding: 6px 8px; box-shadow: 0 0 0 2px var(--line); min-width: 0; }
.guard-warn { font-size: 13px; line-height: 1.6; margin: 4px 0 8px; padding: 6px 10px; color: var(--ink); background: color-mix(in srgb, #8a4fff 18%, var(--panel-2)); box-shadow: 0 0 0 2px #8a4fff; }
/* ギルドマスターの助言（道具の注意書き）と、心得の書き方のコツ */
.gm-tip { margin: 4px 0 10px; padding: 8px 12px; background: color-mix(in srgb, var(--accent) 14%, var(--panel-2)); box-shadow: 0 0 0 2px var(--accent); }
.gm-tip-who { display: inline-block; font-size: 11px; font-weight: bold; color: #12152a; background: var(--accent); padding: 1px 8px; }
.gm-tip p { margin: 6px 0 0; font-size: 13px; line-height: 1.6; }
.prompt-tips { margin: 4px 0 8px; padding: 6px 10px; background: var(--panel-2); box-shadow: 0 0 0 2px var(--line); }
.prompt-tips summary { cursor: pointer; color: var(--info); font-size: 13px; }
.prompt-tips ol { margin: 6px 0; padding-left: 20px; line-height: 1.6; }
.prompt-tips p { margin: 4px 0 8px; }

/* ---- 募集要項・準備・講評 ---- */
.logo-name { letter-spacing: .06em; }
.brief { max-width: 920px; margin: 0 auto; }
.brief h2 { margin-top: 30px; padding-bottom: 4px; border-bottom: 2px solid var(--line); }
.brief-title { font-size: 34px; color: var(--accent); margin: 4px 0 10px; letter-spacing: .06em; line-height: 1.3; }
.brief-sub { display: block; font-size: 26px; color: var(--ink); }
.eyebrow { color: var(--info); letter-spacing: .12em; margin: 0; font-size: 13px; }
.scene-table td:first-child { white-space: nowrap; color: var(--accent); }
.scene-list { list-style: none; padding: 0; margin: 6px 0; }
.scene-item { display: grid; grid-template-columns: 7.5em 1fr; gap: 0 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.scene-item b { color: var(--accent); grid-row: span 3; }
.scene-ex { color: var(--muted); }
.scene-note { color: var(--muted); font-size: 12px; }
.prepare-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.prepare-card { background: var(--panel); box-shadow: 0 0 0 2px var(--line), 4px 4px 0 0 #0a0c18; padding: 12px 14px; }
.prepare-card b { font-size: 17px; color: var(--accent); margin-right: 6px; }
.prepare-card p { margin: 6px 0 0; }
.prepare-icon { font-size: 22px; }
.prepare-ai, .ai-term { display: inline-block; font-size: 11px; color: #12152a; background: var(--info); padding: 0 6px; margin-left: 6px; vertical-align: middle; letter-spacing: 0; }
.slot-count { float: right; font-size: 12px; color: var(--muted); font-weight: normal; }
.library .lib-item { margin: 6px 0; background: var(--panel-2); padding: 4px 10px; }
.library .lib-item summary { cursor: pointer; }
.scroll-shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-bottom: 10px; }
.scroll-card { background: var(--panel-2); padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.scroll-card.on { box-shadow: 0 0 0 2px #ff9ce6; }
.scroll-card .btn { align-self: flex-start; margin-top: auto; }
.scroll-dl { display: grid; grid-template-columns: 5em 1fr; gap: 2px 6px; margin: 0; }
.scroll-dl dt { color: var(--muted); }
.scroll-dl dd { margin: 0; }
h4 { margin: 12px 0 6px; font-size: 13px; color: var(--muted); }
.story p { font-size: 16px; }

.review { border-left: 6px solid var(--accent); }
.review-head { display: flex; gap: 18px; align-items: center; }
.review-head h3 { margin: 2px 0 6px; }
.grade-badge { flex: none; width: 96px; height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0d1022; box-shadow: 0 0 0 3px var(--accent), 5px 5px 0 0 #0a0c18; }
.grade-letter { font-size: 56px; line-height: 1; color: var(--accent); }
.grade-label { font-size: 11px; color: var(--muted); }
.grade-S .grade-badge { box-shadow: 0 0 0 3px #ffd166, 0 0 18px #ffd16688, 5px 5px 0 0 #0a0c18; }
.grade-S .grade-letter { color: #ffd166; text-shadow: 0 0 10px #ffd16699; }
.grade-A .grade-letter { color: #7bed9f; } .grade-A { border-left-color: #7bed9f; }
.grade-B .grade-letter { color: #5fcde4; } .grade-B { border-left-color: #5fcde4; }
.grade-C .grade-letter { color: #c77dff; } .grade-C { border-left-color: #c77dff; }
.grade-D .grade-letter { color: #ff8a8a; } .grade-D { border-left-color: #ff8a8a; }
.gm-bubble { position: relative; background: var(--panel-2); padding: 10px 14px; margin: 0; box-shadow: 0 0 0 2px var(--line); }
.review-parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin: 16px 0; }
.review-part { background: var(--panel-2); padding: 10px 12px; }
.rp-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.rp-head b { font-size: 16px; }
.rp-score { margin-left: auto; }
.rp-mark { width: 28px; height: 28px; line-height: 28px; text-align: center; font-size: 18px; background: #0d1022; }
.m-◎ { color: #ffd166; } .m-○ { color: #7bed9f; } .m-△ { color: #feae34; } .m-× { color: #ff8a8a; } .m-－ { color: var(--muted); }
.rp-k { font-size: 12px; margin-top: 4px; }
.rp-good .rp-k { color: #7bed9f; } .rp-better .rp-k { color: #feae34; }
.review-part ul { margin: 2px 0 4px; padding-left: 18px; font-size: 13px; }
.rp-lesson summary { cursor: pointer; font-size: 12px; color: var(--info); }
.rp-lesson p { margin: 4px 0 0; }
.review-next { background: #0d1022; padding: 10px 14px; margin-bottom: 10px; box-shadow: 0 0 0 2px var(--accent); }
details.diag summary { cursor: pointer; }
@media (max-width: 760px) {
  .prepare-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .review-head { flex-direction: column; align-items: flex-start; }
  .brief-title { font-size: 26px; } .brief-sub { font-size: 20px; }
}
.review .btn-primary { width: auto; margin-top: 0; }
.sent-list { list-style: none; padding: 0; margin: 0; }
.sent-list li { padding: 8px 0; border-bottom: 1px dashed var(--line); }
.sent-list .row-gap { gap: 12px; }
.brief .btn-primary, .dash .btn-primary { width: auto; margin-top: 0; }
.logo-tag { font-size: 11px; color: var(--muted); margin-left: -12px; white-space: nowrap; }
@media (max-width: 1100px) { .logo-tag { display: none; } }
.hero-tag { color: var(--info); margin: 0 0 10px; font-size: 15px; }
.pitch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 28px; }
.pitch-card { background: var(--panel); box-shadow: 0 0 0 2px var(--line), 4px 4px 0 0 #0a0c18; padding: 14px 16px; }
.pitch-card h3 { margin: 4px 0 6px; font-size: 18px; }
.pitch-icon { font-size: 26px; }
.learn-list { list-style: none; padding: 0; }
.learn-list li { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.learn-list b { color: var(--accent); min-width: 5em; }
.flow { padding-left: 0; list-style: none; counter-reset: f; }
.flow li { counter-increment: f; display: grid; grid-template-columns: 34px 12em 1fr; gap: 8px; align-items: baseline; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.flow li::before { content: counter(f); width: 26px; height: 26px; line-height: 26px; text-align: center; background: var(--accent); color: #12152a; }
.flow b { color: var(--accent); }
.mech-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.mech-card { background: var(--panel); box-shadow: 0 0 0 2px var(--line), 4px 4px 0 0 #0a0c18; padding: 12px 14px; }
.mech-head { display: flex; align-items: center; gap: 6px; }
.mech-head b { font-size: 17px; color: var(--accent); }
.mech-card p { margin: 6px 0; }
.join .login-card, .join .entry-card { max-width: 520px; }
@media (max-width: 760px) { .pitch { grid-template-columns: 1fr; } .flow li { grid-template-columns: 34px 1fr; } .flow li span { grid-column: 2; } }
.quest { border-left: 6px solid #ff5a6e; } .quest-title { color: #ff8a9a; margin: 2px 0 8px; } .quest h3 { margin-top: 14px; }
nav a.locked { opacity: .45; }
nav a.locked::after { content: ' 🔒'; font-size: 10px; }
.wait-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(5,6,13,.82); display: flex; align-items: center; justify-content: center; padding: 16px; }
.wait-box { width: min(560px, 100%); background: var(--panel); box-shadow: 0 0 0 3px var(--accent), 6px 6px 0 0 #0a0c18; padding: 20px 22px; }
.wait-box h2 { margin: 2px 0 12px; }
.wait-bar { height: 16px; background: #0d1022; box-shadow: 0 0 0 2px var(--line); margin: 12px 0 6px; }
.wait-fill { height: 100%; width: 3%; background: repeating-linear-gradient(45deg, var(--accent) 0 8px, #ffd166 8px 16px); transition: width .6s; }
.wait-fill.done { background: var(--accent-2); }
.wait-label { margin: 4px 0; }
.wait-scene { display: flex; align-items: center; gap: 8px; font-size: 28px; }
.wait-road { flex: 1; height: 4px; background: repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 14px); animation: road 1s linear infinite; }
@keyframes road { from { background-position: 0 0; } to { background-position: 14px 0; } }
.wait-hero { animation: hop .6s ease-in-out infinite alternate; }
@keyframes hop { from { transform: translateY(0); } to { transform: translateY(-6px); } }
.wait-actions { margin-top: 12px; }
.wait-actions .btn-primary { width: auto; margin-top: 0; }
.empty .btn-primary { width: auto; margin-top: 8px; }
.reports { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.report { background: var(--panel-2); padding: 8px 12px; border-left: 4px solid var(--muted); }
.report-head { display: flex; justify-content: space-between; gap: 8px; }
.report-head b { color: var(--accent); }
.report p { margin: 4px 0 0; font-size: 13px; line-height: 1.7; }
.admin-settings input:not([type=radio]), .admin-login input { font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--panel-2); border: 0; padding: 6px 8px; box-shadow: 0 0 0 2px var(--line); width: 100%; box-sizing: border-box; }
.admin-settings .btn-primary { width: auto; margin-top: 0; }
.admin-login { max-width: 460px; }
.admin-login form { display: flex; gap: 8px; }

/* ---- 準備画面: 上に固定の「出発の準備」バー、左に討伐依頼書と資料室（スクロールに追従） ---- */
.dock { position: sticky; top: var(--topbar-h, 55px); z-index: 9; margin: -6px 0 16px; }
.dock-bar { display: flex; align-items: center; gap: 14px; background: #0d1022; box-shadow: 0 0 0 2px var(--line), 0 6px 14px rgba(0,0,0,.45); padding: 8px 14px; flex-wrap: wrap; }
.dock-avatar { width: 52px; height: 40px; background: radial-gradient(circle at 50% 75%, #b08a5a 0 38%, #4b8b3b 39%); box-shadow: 0 0 0 2px var(--line); }
.dock-who { display: flex; flex-direction: column; min-width: 150px; }
.dock-name { font-size: 15px; }
.dock-meter { flex: 1; min-width: 220px; max-width: 420px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--ink); font-family: var(--font); }
.dock-meter .meter { margin: 2px 0 0; }
.dock-meter:hover .meter { box-shadow: 0 0 0 2px var(--accent); }
.dock-label { color: var(--muted); }
.dock-err { color: #ff8a8a; max-width: 260px; }
.dock-actions { display: flex; gap: 8px; margin-left: auto; }
.dock-actions .btn { width: auto; margin: 0; padding: 8px 16px; }
.dock-panel { background: var(--panel); box-shadow: 0 0 0 2px var(--accent), 0 8px 18px rgba(0,0,0,.5); padding: 12px 18px 16px; max-height: 55vh; overflow-y: auto; }
.dock-panel h4 { margin: 0; color: var(--accent); font-size: 15px; }
.dock-panel .confirm-box .btn-primary { width: auto; margin: 0; }
.submit-page { grid-template-columns: minmax(340px, 42%) minmax(0, 1fr); gap: 22px; }
.ref-col { position: sticky; top: calc(var(--topbar-h, 55px) + var(--dock-h, 75px)); height: calc(100vh - var(--topbar-h, 55px) - var(--dock-h, 75px) - 14px); display: flex; flex-direction: column; background: var(--panel); box-shadow: 0 0 0 2px var(--line), 4px 4px 0 0 #0a0c18; }
.ref-tabs { margin: 0; padding: 8px 10px 0; border-bottom: 2px solid var(--line); }
.ref-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 20px; }
.ref-scroll .quest { box-shadow: none; background: none; padding: 0 0 0 16px; margin: 0; border-left: 4px solid #ff5a6e; }
.quest { padding: 18px 22px; }
.quest p { line-height: 1.75; }
.reports { grid-template-columns: minmax(0, 1fr); gap: 12px; }
.report { padding: 12px 16px 12px 18px; }
.report p { line-height: 1.8; margin-top: 6px; }
.lib-pane .library .lib-item { padding: 6px 12px; }
.lib-pane .ref-body, .lib-pane pre { white-space: pre-wrap; }
.hero-row { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 18px; align-items: start; }
.hero-row .preview-box canvas { width: 200px; height: auto; }
.sent-card { padding: 14px 18px; }
.builder .card { padding: 16px 20px 20px; }
@media (max-width: 1200px) { .submit-page { grid-template-columns: minmax(300px, 40%) minmax(0, 1fr); } }
@media (max-width: 900px) {
  .submit-page { grid-template-columns: minmax(0, 1fr); }
  .ref-col { position: static; max-height: none; height: auto; display: none; }
  .panel-tabs { display: flex; }
  .submit-page.show-task .ref-col { display: flex; }
  .submit-page.show-task .editor-col { display: none; }
  .hero-row { grid-template-columns: minmax(0, 1fr); }
  .dock-meter { min-width: 140px; }
  /* スマホ: 準備バーを1〜2行に詰める（キャラ・名前・重さ・ボタンを常に見せる） */
  .dock-bar { gap: 8px 10px; padding: 6px 10px; }
  .dock-avatar { width: 40px; height: 31px; }
  .dock-who { min-width: 0; flex: 1; }
  .dock-who .small { display: none; }
  .dock-meter { order: 3; flex-basis: 100%; max-width: none; }
  .dock-actions { margin-left: 0; }
  .dock-actions .btn { padding: 6px 10px; font-size: 12px; }
}
.ref-scroll pre.ref-body { max-height: none; }
.admin-settings td input { min-width: 120px; }

/* 資料室: 棚と検索 */
.lib-tools { display: flex; gap: 10px; align-items: center; margin: 6px 0 4px; }
.lib-search { flex: 1; min-width: 0; }
.lib-shelf h4 { margin: 14px 0 4px; font-size: 13px; color: var(--accent); display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line, #333a5a); padding-bottom: 3px; }
.lib-count { font-size: 11px; color: var(--muted, #9aa); font-weight: normal; }

/* 冒険の記録 */
.advlog-card { background: var(--panel); box-shadow: 0 0 0 2px var(--line), 4px 4px 0 0 #0a0c18; padding: 14px 18px 18px; margin: 18px 0; border-left: 6px solid #5fc8e6; }
.advlog-card h3 { margin-top: 0; }
.seg { display: inline-flex; gap: 6px; }
.btn-sm { padding: 4px 10px; font-size: 12px; white-space: nowrap; }
.advlog-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.advlog { background: var(--panel-2); border-left: 4px solid var(--line); }
.advlog.is-ok { border-left-color: #3fbf7f; }
.advlog.is-ng { border-left-color: var(--danger, #e05050); }
.advlog > summary { cursor: pointer; display: grid; grid-template-columns: 28px minmax(0, 1.3fr) minmax(0, 2fr) auto; gap: 10px; align-items: center; padding: 8px 10px; }
.advlog-mark { font-weight: bold; text-align: center; }
.is-ok .advlog-mark { color: #3fbf7f; } .is-ng .advlog-mark { color: var(--danger, #e05050); }
.advlog-ans { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.advlog .trace { padding: 0 12px 12px 48px; }
.trace-list { list-style: none; margin: 0; padding: 0; border-left: 2px dashed var(--line); }
.tr { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 6px 0 6px 12px; position: relative; }
.tr::before { content: ''; position: absolute; left: -6px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.tr-k { font-size: 11px; font-weight: bold; padding: 2px 0; text-align: center; border-radius: 3px; height: fit-content; background: #2a3060; color: #cfd4ff; }
.tr-body { white-space: pre-wrap; font-size: 13px; line-height: 1.6; }
.tr-out { margin: 4px 0 0; padding: 6px 8px; background: rgba(0,0,0,.25); font-size: 12px; white-space: pre-wrap; max-height: 160px; overflow: auto; }
.tr-heard .tr-k { background: #3a3f6a; } .tr-heard::before { background: #9aa0c8; }
.tr-guard .tr-k { background: #5a3a8a; color: #e8d8ff; } .tr-guard::before { background: #b08aff; }
.tr-think .tr-k { background: #6a5a2a; color: #ffe8a8; } .tr-think::before { background: var(--accent); }
.tr-think .tr-body { color: #ffe8a8; }
.tr-tool .tr-k { background: #2a5a6a; color: #c8f0ff; } .tr-tool::before { background: #5fc8e6; }
.tr-skill .tr-k { background: #2a5a3a; color: #c8ffd8; } .tr-skill::before { background: #5fd88a; }
.tr-answer.tr-ok .tr-k { background: #1f6a44; color: #fff; } .tr-answer.tr-ok::before { background: #3fbf7f; }
.tr-answer.tr-ng .tr-k { background: #7a2a2a; color: #fff; } .tr-answer.tr-ng::before { background: #e05050; }
.trace-guide { display: inline-block; }
.trace-guide ul { margin: 6px 0; padding-left: 18px; }
.trial-trace { margin-top: 6px; }
.trial-trace .trace { margin-top: 6px; }
@media (max-width: 700px) { .advlog > summary { grid-template-columns: 24px 1fr; } .advlog-ans, .advlog-meta { grid-column: 2; } .advlog .trace { padding-left: 12px; } }

.scoring-how { background: var(--panel); box-shadow: 0 0 0 2px var(--line); padding: 12px 16px; margin: 18px 0; }
.scoring-how summary { cursor: pointer; }
.scoring-how ol { margin: 10px 0 6px; padding-left: 20px; display: grid; gap: 6px; }

.pattern-row { margin: 8px 0 4px; padding: 8px; background: rgba(255,255,255,.03); box-shadow: 0 0 0 1px var(--line); }
.pattern-picker { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 4px; }
.pattern-row[hidden] { display: none; }

.perk-list { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 900px; }
@media (max-width: 700px) { .perk-list { grid-template-columns: 1fr; } }
.perk-list li { display: flex; gap: 12px; background: var(--panel); box-shadow: 0 0 0 2px var(--line); padding: 12px 14px; }
.perk-icon { font-size: 26px; line-height: 1; }
.perk-list p { margin: 4px 0 0; }

/* ===== 紹介ページ（#/about と 1ファイル版 lp.html） =====
   RPG のメッセージウィンドウ（白い二重枠）を骨組みにする。見出しは窓の枠に乗せる */
.lp { max-width: 1120px; margin: 0 auto; --win: #0d1022; }
.lp-standalone main { padding-top: 24px; }
.win {
  position: relative; background: var(--win); border: 3px solid var(--ink); border-radius: 6px;
  box-shadow: 0 0 0 3px var(--win), 6px 6px 0 3px #05060d; padding: 18px 20px;
}
.win-title { position: absolute; top: -0.9em; left: 14px; margin: 0; padding: 0 8px; background: var(--win); color: var(--accent); font-size: 15px; line-height: 1.6; }
.lp h2 { font-size: 28px; color: var(--ink); margin: 0 0 10px; letter-spacing: .06em; display: flex; align-items: center; gap: 12px; }
.lp h2::before { content: ''; width: 12px; height: 12px; background: var(--accent); box-shadow: 4px 4px 0 #e43b44; flex: none; }
.lp-sec { margin: 84px 0 0; }
.lp-intro { max-width: 46em; color: var(--muted); margin: 0 0 22px; }
.lp-sub { color: var(--accent); font-size: 18px; margin: 36px 0 14px; }

/* ヒーロー: 動くステージの下端に、タイトルの窓を重ねる */
.lp-hero { margin: 4px 0 0; }
.lp-hero-stage { position: relative; line-height: 0; box-shadow: 0 0 0 3px var(--line), 6px 6px 0 3px #05060d; }
.lp-hero-canvas { width: 100%; height: auto; display: block; }
.lp-hero-boss { position: absolute; right: 10px; top: 10px; margin: 0; line-height: 1.4; font-size: 13px; color: var(--ink); background: rgba(13,16,34,.82); padding: 3px 10px; box-shadow: 0 0 0 2px var(--line); }
.lp-hero-win { margin: -72px 0 0 28px; max-width: 660px; padding: 22px 26px 24px; }
.lp-logo { margin: 0 0 12px; line-height: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.lp-logo-en { font-family: "Silkscreen", "DotGothic16", monospace; font-weight: 700; white-space: nowrap; font-size: clamp(30px, 8.4vw, 72px); letter-spacing: .02em; line-height: .95;
  background: linear-gradient(#fff6c8 0%, #ffd23f 38%, #ff9b2f 62%, #e8572a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(2px 0 0 #2a0f08) drop-shadow(-2px 0 0 #2a0f08) drop-shadow(0 2px 0 #2a0f08) drop-shadow(0 -2px 0 #2a0f08) drop-shadow(4px 4px 0 #e43b44) drop-shadow(3px 3px 0 #05060d); }
.lp-logo-ja { font-size: clamp(12px, 1.6vw, 16px); letter-spacing: .5em; color: #fff1d6; padding-left: 4px; }
.lp-catch { font-size: 21px; margin: 0 0 8px; }
.lp-lead { color: var(--muted); margin: 0 0 14px; }
.lp-cmd { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 18px; }
.lp-cmd button { font: inherit; font-size: 16px; color: var(--ink); background: none; border: 0; padding: 4px 0 4px 20px; cursor: pointer; position: relative; }
.lp-cmd button::before { content: '▶'; position: absolute; left: 0; color: var(--accent); opacity: 0; }
.lp-cmd button:hover::before, .lp-cmd button:focus-visible::before { opacity: 1; animation: lp-blink .8s steps(1) infinite; }
.lp-cmd button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
@keyframes lp-blink { 50% { opacity: 0; } }
.lp .lp-play { width: auto; margin: 0; padding: 12px 34px; font-size: 18px; }
.lp-noplay { color: var(--info); margin: 0; }

/* 遊び方: 3つの手順と、持たせるもの */
.lp-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px; counter-reset: lpstep; }
.lp-step { position: relative; counter-increment: lpstep; }
.lp-step + .lp-step::before { content: '▶'; position: absolute; left: -26px; top: 70px; color: var(--line); font-size: 18px; }
.lp-step-canvas { width: 100%; height: auto; display: block; box-shadow: 0 0 0 3px var(--line); }
.lp-step h3 { font-size: 20px; color: var(--ink); margin: 14px 0 4px; display: flex; align-items: center; gap: 10px; }
.lp-step h3::before { content: counter(lpstep); width: 28px; height: 28px; line-height: 28px; text-align: center; background: var(--accent); color: #12152a; font-size: 16px; }
.lp-step p { margin: 0; color: var(--muted); }
.lp-kit { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.lp-kit li { background: var(--panel); box-shadow: 0 0 0 2px var(--line); padding: 14px 12px; display: grid; justify-items: start; align-content: start; gap: 2px; }
.lp-kit .lp-icon { margin-bottom: 8px; }
.lp-kit b { font-size: 18px; color: var(--accent); font-weight: normal; }
.lp-ai { font-size: 12px; color: var(--info); }
.lp-tip { margin: 30px 0 0; max-width: 46em; padding: 16px 20px; line-height: 1.8; }
.lp-tip b { display: block; color: var(--accent); font-weight: normal; margin-bottom: 2px; }
.lp-kit p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

/* 討伐の再生 */
.lp-demo { background: var(--panel); box-shadow: 0 0 0 3px var(--line), 6px 6px 0 3px #05060d; padding: 10px; }
.lp-demo-hud { display: flex; gap: 14px; align-items: baseline; padding: 2px 4px 10px; flex-wrap: wrap; }
.lp-demo-wave { color: var(--accent); }
.lp-demo-case { font-size: 16px; }
.lp-sound { min-width: 6.5em; }
.lp-sound[aria-pressed="true"] { background: var(--accent); color: #12152a; }

/* 演出の見本 */
.lp-fx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 26px 22px; }
.lp-fx { margin: 0; padding: 10px 10px 14px; }
.lp-clip { box-shadow: 0 0 0 2px var(--line); }
.lp-clip { position: relative; cursor: pointer; }
.lp-clip-btn { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; background: rgba(10, 10, 24, 0.35); cursor: pointer; display: grid; place-items: center; font: inherit; color: var(--ink); -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.lp-clip-btn:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }
.lp-clip-mark { font-size: 16px; padding: 6px 16px; background: rgba(10, 10, 24, 0.85); box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px rgba(10, 10, 24, 0.85); }
.lp-clip.is-playing .lp-clip-btn { background: none; place-items: end end; }
.lp-clip.is-playing .lp-clip-mark { font-size: 10px; padding: 1px 6px; margin: 0 6px 6px 0; box-shadow: 0 0 0 1px var(--line); opacity: .8; }
.lp-what { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
.lp-what h3 { margin-top: 0; }
.lp-fx figcaption { padding: 12px 6px 0; display: grid; gap: 4px; }
.lp-fx b { font-size: 18px; font-weight: normal; color: var(--accent); }
.lp-fx span { font-size: 13px; color: var(--muted); }

/* キャラ図鑑・ボス図鑑 */
.lp-dex { margin-top: 30px; padding-top: 22px; }
.lp-chars { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px 4px; }
.lp-char { display: grid; justify-items: center; gap: 2px; padding: 4px 0 6px; cursor: pointer; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.4; }
.lp-char:hover, .lp-char:focus-visible { color: var(--ink); background: var(--panel); outline: none; box-shadow: 0 0 0 2px var(--line); }
.lp-char-canvas { width: 100%; max-width: 104px; height: auto; }
@media (max-width: 1100px) { .lp-chars { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.lp-bosses { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 28px 22px; }
.lp-boss { padding: 10px 10px 16px; }
.lp-boss:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
.lp-boss-art { line-height: 0; display: flex; justify-content: center; padding: 6px 0 0; box-shadow: 0 0 0 2px var(--line); }
.lp-boss-canvas { width: 192px; height: 168px; }
.lp-boss-art { position: relative; }
.lp-boss-hidden h3 { letter-spacing: .3em; color: var(--muted); }
.lp-boss-q { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Silkscreen", "DotGothic16", monospace; font-size: 88px; line-height: 1; color: #ffd23f; text-shadow: 4px 4px 0 #05060d; animation: lp-q 2.4s ease-in-out infinite; }
@keyframes lp-q { 0%, 100% { transform: translateY(0); opacity: .9; } 50% { transform: translateY(-6px); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .lp-boss-q { animation: none; } }
.lp-boss-season { margin: 12px 4px 0; color: var(--info); font-size: 13px; }
.lp-boss h3 { margin: 0 4px 6px; color: var(--ink); font-size: 17px; }
.lp-boss p:last-child { margin: 0 4px; font-size: 13px; color: var(--muted); }

/* ランキング */
.lp-rank-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 34px; align-items: start; }
.lp-rank-wrap > div > p { margin: 0 0 14px; }
.lp-order { list-style: none; padding: 0; margin: 0 0 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; max-width: 360px; counter-reset: lpord; }
.lp-order li { counter-increment: lpord; display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: center; background: var(--panel); box-shadow: 0 0 0 2px var(--line); padding: 8px 14px 8px 10px; }
.lp-order li::before { content: counter(lpord); grid-row: span 2; width: 26px; height: 26px; line-height: 26px; text-align: center; background: var(--accent); color: #12152a; }
.lp-order b { font-weight: normal; font-size: 17px; color: var(--accent); }
.lp-order span { font-size: 12px; color: var(--muted); }
.lp-board { padding-top: 24px; }
.lp-table-scroll { overflow-x: auto; }
.lp-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.lp-table th { text-align: left; font-weight: normal; color: var(--muted); font-size: 12px; padding: 4px 8px; border-bottom: 2px solid var(--line); }
.lp-table td { padding: 4px 8px; border-bottom: 1px dashed var(--line); white-space: nowrap; }
.lp-table tbody tr:first-child td { color: var(--accent); }
.lp-rank { font-size: 18px; text-align: center; }
.lp-who { display: flex; align-items: center; gap: 8px; }
.lp-who canvas { width: 28px; height: 30px; }
.lp-you { font-size: 11px; padding: 1px 6px; border-radius: 8px; background: #ffd166; color: #2b1d0e; white-space: nowrap; }

/* 工夫としくみ: ギルドマスターが語る */
.lp-gm { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 26px; align-items: start; margin-top: 18px; }
.lp-gm-face { position: sticky; top: calc(var(--topbar-h, 55px) + 16px); display: grid; justify-items: center; gap: 4px; color: var(--accent); font-size: 14px; }
.lp-standalone .lp-gm-face { top: 16px; }
.lp-gm-canvas { width: 156px; height: 120px; background: var(--panel); box-shadow: 0 0 0 3px var(--line); }
.lp-gm-talk { display: grid; gap: 22px; }
.lp-say h3 { margin: 0 0 6px; color: var(--accent); font-size: 18px; }
.lp-say p { margin: 0; line-height: 1.8; }
.lp-say:first-child::before { content: ''; position: absolute; left: -15px; top: 22px; border: 9px solid transparent; border-right-color: var(--ink); border-left: 0; }

/* 最後の導線 */
.lp-cta { margin: 110px 0 48px; }
.lp-cta-stage { position: relative; line-height: 0; background: #1b1d47; box-shadow: 0 0 0 3px var(--line), 6px 6px 0 3px #05060d; }
.lp-cta-canvas { width: 100%; height: auto; display: block; }
.lp-cta-copy { position: absolute; left: 0; right: 0; top: 3.5%; text-align: center; line-height: 1.25; pointer-events: none; }
.lp-cta-kicker { font-family: "Silkscreen", "DotGothic16", monospace; margin: 0 0 4px; color: #fff1d6; font-size: clamp(12px, 1.5vw, 16px); letter-spacing: .3em; text-shadow: 2px 2px 0 #05060d; }
.lp .lp-cta-title { display: block; margin: 0; font-size: clamp(30px, 5.8vw, 66px); color: #fff6d8; letter-spacing: .08em; text-shadow: 3px 3px 0 #e43b44, 6px 6px 0 #05060d; animation: lp-float 1.6s steps(2) infinite; }
.lp .lp-cta-title::before { content: none; }
.lp-cta-title span { display: inline-block; }
@keyframes lp-float { 50% { transform: translateY(-4px); } }
.lp-cta-win { max-width: 640px; margin: -28px auto 0; padding: 22px 26px 18px; }
.lp-cta-lead { margin: 0 0 14px; line-height: 1.8; }
.lp-cta-msg { margin: 0 0 14px; color: var(--info); }
.lp-cta-msg b { display: block; color: var(--accent); font-weight: normal; font-size: 13px; }
.lp-cta-msg::after { content: '▼'; margin-left: 6px; color: var(--ink); font-size: 11px; animation: lp-blink .8s steps(1) infinite; }
.lp-cta-cmd { list-style: none; margin: 0; padding: 12px 0 0; border-top: 2px dashed var(--line); display: grid; gap: 2px; justify-items: start; }
.lp-go { font: inherit; font-size: 17px; color: var(--ink); background: none; border: 0; padding: 6px 4px 6px 28px; position: relative; cursor: pointer; text-decoration: none; display: inline-block; }
.lp-go::before { content: '▶'; position: absolute; left: 6px; color: var(--accent); opacity: 0; }
.lp-go:hover::before, .lp-go:focus-visible::before { opacity: 1; animation: lp-blink .8s steps(1) infinite; }
.lp-go:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.lp-cta-cmd:not(:hover):not(:focus-within) li:first-child .lp-go::before { opacity: 1; animation: lp-blink .8s steps(1) infinite; } /* 何もさわっていないときは、先頭のコマンドにカーソル */
.lp .lp-go-main { font-size: 30px; color: #12152a; background: var(--accent); padding: 8px 26px 8px 50px; margin: 0 0 10px; box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--win), 6px 6px 0 6px #05060d; }
.lp .lp-go-main::before { opacity: 1; left: 18px; color: #12152a; animation: lp-blink .8s steps(1) infinite; }
.lp .lp-go-main:hover { background: #ffc35a; }
.lp-sound-note { display: none; margin: 8px 4px 0; font-size: 12px; color: var(--muted); }
@media (hover: none) { .lp-sound-note { display: block; } }

@media (max-width: 900px) {
  .lp-kit { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lp-rank-wrap { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .lp h2 { font-size: 23px; }
  .lp-sec { margin-top: 60px; }
  .lp-hero-win { margin: -20px 6px 0; padding: 18px 16px 20px; }
  .lp-catch { font-size: 18px; }
  .lp-hero-boss { font-size: 11px; right: 6px; top: 6px; padding: 2px 6px; }
  .lp-steps { grid-template-columns: minmax(0, 1fr); gap: 26px; }
  .lp-step + .lp-step::before { content: none; }
  .lp-step { display: grid; grid-template-columns: 120px minmax(0, 1fr); column-gap: 14px; }
  .lp-step-canvas { grid-row: span 2; }
  .lp-step h3 { margin-top: 0; }
  .lp-kit { grid-template-columns: minmax(0, 1fr); }
  .lp-kit li { grid-template-columns: auto 1fr; column-gap: 12px; align-items: center; }
  .lp-kit .lp-icon { grid-row: span 3; margin: 0; }
  .lp-kit p { grid-column: 2; margin-top: 2px; }
  .lp-fx-grid { grid-template-columns: minmax(0, 1fr); }
  .lp-dex { padding: 20px 8px 10px; }
  .lp-char { font-size: 10px; padding: 2px 0 4px; }
  .lp-gm { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .lp-gm-face { position: static; grid-template-columns: auto 1fr; justify-items: start; align-items: center; gap: 12px; }
  .lp-gm-canvas { width: 104px; height: 80px; }
  .lp-say:first-child::before { left: 24px; top: -15px; border: 9px solid transparent; border-bottom-color: var(--ink); border-top: 0; }
  .lp-table { font-size: 13px; }
  .lp-cta { margin-top: 80px; }
  .lp-cta-copy { position: static; padding: 18px 8px 14px; }
  .lp-cta-win { margin: -14px 6px 0; padding: 18px 16px 14px; }
  .lp .lp-go-main { font-size: 26px; }
}
